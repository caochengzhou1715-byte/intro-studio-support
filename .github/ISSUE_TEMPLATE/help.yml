name: Help or bug report
description: Ask for help with Intro Studio
body:
  - type: markdown
    attributes:
      value: "This request is public. Do not include personal information, passwords or private media."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Device and iOS version
  - type: input
    id: version
    attributes:
      label: Intro Studio version
